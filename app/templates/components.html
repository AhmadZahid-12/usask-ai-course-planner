{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'dashboard' %}<rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/>
{% elif name == 'search' %}<circle cx="10.8" cy="10.8" r="5.8"/><path d="m15 15 4.6 4.6"/>
{% elif name == 'planner' %}<rect x="3.5" y="5.5" width="17" height="15" rx="2"/><path d="M8 3v5m8-5v5M4 10h16m-12 5h3m3 0h2"/>
{% elif name == 'spark' %}<path d="M12 2.5 14.3 9.7 21.5 12l-7.2 2.3L12 21.5l-2.3-7.2L2.5 12l7.2-2.3L12 2.5Z"/>
{% elif name == 'settings' %}<circle cx="12" cy="12" r="3"/><path d="m9.5 3-.6 2.3-2 .9-2.1-.9-1.8 3.2 1.6 1.5v2.4L3 14l1.8 3.2 2.2-.8 2 1 .5 2.1h4l.6-2.1 2-1 2.2.8 1.8-3.2-1.6-1.6V10l1.6-1.5-1.8-3.2-2.1.9-2-.9L13.5 3z" transform="translate(.65 .7)"/>
{% elif name == 'panel' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/>
{% elif name == 'moon' %}<path d="M20.8 14A9 9 0 0 1 10 3.2 9 9 0 1 0 20.8 14Z"/>
{% elif name == 'arrow' %}<path d="M4 12h15m-6-6 6 6-6 6"/>
{% elif name == 'external' %}<path d="M13 5h6v6m0-6-8 8m7 1v5H5V6h5"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'lock' %}<rect x="5.5" y="10" width="13" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>
{% elif name == 'review' %}<circle cx="12" cy="12" r="8.5"/><path d="M12 7.8v4.5m0 3.6h.01"/>
{% elif name == 'book' %}<path d="M12 6v14M3 5h5a4 4 0 0 1 4 2 4 4 0 0 1 4-2h5v13h-5a4 4 0 0 0-4 2 4 4 0 0 0-4-2H3z"/>
{% elif name == 'close' %}<path d="m6 6 12 12M18 6 6 18"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% endif %}
</svg>
{%- endmacro %}

{% macro page_heading(title, description) %}
<div class="page-heading"><div><h1>{{ title }}</h1><p>{{ description }}</p></div>{{ caller() if caller is defined }}</div>
{% endmacro %}

{% macro metric(id, label, glyph, tone) %}
<article class="card metric">
    <span class="metric-icon {{ tone }}">{{ icon(glyph, 17) }}</span>
    <span class="metric-label">{{ label }}</span>
    <strong id="{{ id }}" class="metric-value">—</strong>
</article>
{% endmacro %}
